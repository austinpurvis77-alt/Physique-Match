kind = "web"
previewPath = "/"
title = "OMEGAINS"
version = "1.0.0"
id = "artifacts/physique-rater"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25920

[services.development]
run = "pnpm --filter @workspace/physique-rater run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/physique-rater", "run", "build" ]
publicDir = "artifacts/physique-rater/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25920"
BASE_PATH = "/"
